    <style>
        body {
            display: flex;
            flex-direction: column;

  <body>
  
  
 <script>
function setPlayermale() {
  localStorage.playerGender = 'male';
  console.log("joyM="+localStorage.playerGender);
  setTimeout(() => {
    window.location.href = "joy.html";
  }, 1000);
}

function setPlayerFemale() {
  localStorage.playerGender = 'female';
  console.log("joyF="+ localStorage.playerGender);
  setTimeout(() => {
    window.location.href = "joy.html";
  }, 1000);
}
 </script>
